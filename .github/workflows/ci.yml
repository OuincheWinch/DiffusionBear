name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (compile + tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Same pinned versions as the app (backend/requirements.txt), minus the
      # Apple-Silicon-only MLX packages: the generator guards those imports, so
      # the suite runs on the CI image.
      - name: Install test dependencies
        run: |
          grep -vE '^(mlx|mlx-lm|mlx-taef|mlx-teacache)==' backend/requirements.txt > /tmp/requirements-ci.txt
          python -m pip install --disable-pip-version-check -r /tmp/requirements-ci.txt
      - name: Compile-check backend packages
        run: |
          python -m compileall -q backend
          echo "backend python OK"
      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: |
          if ls backend/test_*.py 1> /dev/null 2>&1; then
            python - <<'PY'
          import os, sys, unittest
          os.chdir("backend")
          sys.path.insert(0, os.getcwd())
          MLX_PREFIXES = ("mlx", "mflux", "mlx_lm", "mlx_vlm")
          # Skip Apple-Silicon-only test modules that require mlx/mflux at import or runtime
          # on ubuntu-24.04 (no Metal GPU; 7.7 GB runner RAM).
          APPLE_ONLY_TESTS = {
              "test_artifact_migration.py",
              "test_auto_bind_model.py",
              "test_fibo_integration.py",
              "test_fibo_prompt_cache.py",
              "test_krea_bf16_denoise.py",
              "test_latency_cache.py",
              "test_mflux_adapter.py",
              "test_mflux_prompt_cache.py",
              "test_mlx_sdxl_clip.py",
              "test_mlx_sdxl_denoise.py",
              "test_mlx_sdxl_engine_contract.py",
              "test_mlx_sdxl_integration.py",
              "test_mlx_sdxl_lora.py",
              "test_mlx_sdxl_quant.py",
              "test_mlx_sdxl_schedulers.py",
              "test_mlx_sdxl_unet.py",
              "test_mlx_sdxl_vae.py",
              "test_model_families.py",
              "test_model_integrity.py",
              "test_moss_pipeline.py",
              "test_prompt_enhancer_quality.py",
              "test_qwen_hardening.py",
              "test_qwen_prompt_cache.py",
              "test_sdxl_artifact_cache.py",
              "test_sdxl_subgraph_compile.py",
              "test_sdxl_sync_wins.py",
              "test_staged_mflux.py",
          }
          loader = unittest.TestLoader()
          suite = unittest.TestSuite()
          for path in sorted(os.listdir(".")):
              if not (path.startswith("test_") and path.endswith(".py")):
                  continue
              if path in APPLE_ONLY_TESTS:
                  continue
              mod_name = path[:-3]
              try:
                  loaded = loader.loadTestsFromName(mod_name)
              except Exception as exc:
                  msg = str(exc)
                  if any(f"'{pkg}'" in msg or f" {pkg}" in msg for pkg in MLX_PREFIXES):
                      print(f"[CI] skipped Apple-Silicon-only module at import: {path} ({exc})")
                      continue
                  raise
              # unittest wraps import errors in _FailedTest instead of raising directly
              failed_import = [
                  t for t in loaded
                  if type(t).__name__ == "_FailedTest"
              ]
              if failed_import and any(
                  any(f"'{pkg}'" in str(getattr(t, "_exception", "")) for pkg in MLX_PREFIXES)
                  for t in failed_import
              ):
                  print(f"[CI] skipped Apple-Silicon-only module: {path}")
                  continue
              suite.addTests(loaded)
          runner = unittest.TextTestRunner(verbosity=1)
          res = runner.run(suite)
          if not res.wasSuccessful():
              sys.exit(1)
          PY
          else
            echo "Internal test suite excluded from public release build"
          fi
      - name: Validate launch scripts
        run: |
          bash -n run.sh
          bash -n dev-backend.sh
          python - <<'PY'
          from pathlib import Path
          for name in ("run.sh", "dev-backend.sh"):
              lines = Path(name).read_text().splitlines()
              commands = "\n".join(line for line in lines if line.strip() and not line.lstrip().startswith("#"))
              if "bin/uvicorn" in commands or "-m uvicorn" not in commands:
                  raise SystemExit(f"unsafe launcher: {name}")
          PY

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  license-check:
    name: Licence data sanity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify licence data parses
        run: node -e "const s=require('fs').readFileSync('frontend/src/data/licences.js','utf8'); if(!s.includes('LICENCE_SECTIONS')) throw Error('missing'); console.log('licences.js OK');"