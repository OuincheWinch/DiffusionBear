# Vendored build of mflux, rebased 2026-11-19 onto mflux-community/mflux main
# (014252f, 2026-11-18; last release tag v0.24.0) with DiffusionBear's local patches
# carried over -- see VENDORED_FROM.md for the base commit and the patch list.
# Still 100% PyTorch-free: `torch` is deliberately NOT in dependencies (upstream
# re-added it as a hard dep on main; we keep the no-torch loaders instead).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mflux"
version = "0.24.0"
description = "Vendored mflux (mflux-community main 014252f) rebased with DiffusionBear patches; PyTorch-free"
requires-python = ">=3.13"
dependencies = [
  "filelock>=3.20.1",
  "huggingface-hub>=1.1.6,<3.0",
  "mlx>=0.32.0,<0.33.0",
  "numpy>=2.0.1,<3.0",
  "piexif>=1.1.3,<2.0",
  "pillow>=12.3.0,<13",
  "platformdirs>=4.0,<5.0",
  "regex>=2024.11.6",
  "requests>=2.33.0",
  "safetensors>=0.4.4,<1.0",
  "sentencepiece>=0.2.1,<1.0",
  "toml>=0.10.2,<1.0",
  "tqdm>=4.66.5,<5.0",
  "transformers>=5.5.0,<6.0",
  "urllib3>=2.8.0",
  "protobuf>=4.25.0,<8.0",
  "pyyaml>=6.0,<7.0",
  "anyio>=4.14.2,<5.0",
  "fsspec>=2026.6.0",
]

[tool.setuptools.packages.find]
include = ["mflux*"]
