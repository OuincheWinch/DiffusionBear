# Vendored build of mflux 0.20.0 + the Qwen-Image 2.1 port (fork PR #736), patched to be
# 100% PyTorch-free (all weight loading and tokenizers run on MLX + NumPy directly).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mflux"
version = "0.20.0"
description = "Vendored mflux with the Qwen-Image 2.1 port (vendored)"
requires-python = ">=3.10"
dependencies = [
  "filelock>=3.20.1",
  "fonttools>=4.60.2",
  "huggingface-hub>=1.1.6,<2.0",
  "hf-transfer>=0.1.9,<1.0",
  "matplotlib>=3.9.2,<4.0",
  "mlx>=0.32.0,<0.33.0",
  "numpy>=2.0.1,<3.0",
  "opencv-python>=4.10.0,<5.0",
  "piexif>=1.1.3,<2.0",
  "pillow>=12.3.0",
  "platformdirs>=4.0,<5.0",
  "regex>=2024.11.6",
  "requests>=2.33.0",
  "safetensors>=0.4.4,<1.0",
  "sentencepiece>=0.2.1,<1.0",
  "toml>=0.10.2,<1.0",
  "tqdm>=4.66.5,<5.0",
  "transformers>=5.5.0,<6.0",
  "urllib3>=2.7.0",
  "protobuf>=4.25.0,<8.0",
  "pyyaml>=6.0,<7.0",
]

[tool.setuptools.packages.find]
include = ["mflux*"]
